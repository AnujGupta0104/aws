<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form autocomplete="on">
        <label>Name: </label>
        <input type="text" placeholder="write your name">
    <br><br>

    <label>Email:</label>
    <input type="email" placeholder="write your email">
    <br><br>

    <!-- <label>Password:</label>
    <input type="password" placeholder="write your password" minlength="8" 
  maxlength="20"  pattern="^(?=.[A-Za-z])(?=.\d)[A-Za-z\d]{8,}$" 
  title="Password must be 8-20 characters long and include both
   letters and numbers."
  required> -->
  <label>Password:</label>
<input type="password"
       placeholder="write your password"
       minlength="8"
       maxlength="20"
       pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
       title="Password must be 8-20 characters long and include both letters and numbers."
       required>
    <br><br>

    <label>Age:</label>
    <input type="number" placeholder="Enter your age">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>

    <label>Country:</label>
    <select>
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="canada">Canada</option>
    </select>
    <br><br>

    <label>Hobbies:</label>
    <input type="checkbox" name="hobby" value="reading"> Reading
    <input type="checkbox" name="hobby" value="traveling"> Traveling
    <input type="checkbox" name="hobby" value="sports"> Sports
    <br><br>

    <label>Date:</label>
    <input type="date">
    <br><br>

    <label>Time:</label>
    <input type="time"> 
    <br><br>

    <label>Color:</label>
    <input type="color">
    <br><br>

    <label>File:</label>
    <input type="file">
    <br><br>

    <label>About Yourself:</label>

<br>

<textarea
    rows="5"
    cols="40"
    placeholder="Tell us about yourself"></textarea>
<br><br>
    <button type="submit">
        Submit
    </button>
    <button type="reset">
        Reset
    </button>
    </form>
    
</body>
</html>
