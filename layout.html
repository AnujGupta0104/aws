<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 500px;
            width: 400px;
            background: #ccc;
            border: 5px solid #000;
            padding: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        nav {
            width: 960656656px;
            height: 400px;
            background-color: #2a913b;

        }

        header {
            width: 990px;
            height: 484px;
            background-color: #cccccc;
        }

        #left,
        {
        flex-grow: 1;
        bakground color: #999;

        }

        #right,
        {
        flex-grow: 2;
        background color: #867;
        display: flex;
        flex-direction: column;
        }

        aside,
        article {
            background-color: #CCCC;
            flex-grow: 1;
        }

        footer {
            width: 960px;
            height: 300px;
            background-color: #CCC;

        }
    </style>
</head>

<body>
    <main>
        <!--header-->
        <header>
            <h2>HEADER </h2>
        </header>
        <!--nav-->
        <nav>
            <h2>Navbar</h2>
        </nav>
        <!--section-->
        <SECTION>
            <div id="left">
                <div id="right">
                    <aside>
                        <h2>Aside</h2>
                    </aside>
                    <article>
                        <h2>Article</h2>
                    </article>
                </div>
        </SECTION>
        <footer>
            <h2>FOOTER</h2>
        </footer>
    </main>

</body>

</html>
