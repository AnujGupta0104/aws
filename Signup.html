
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - QuickBasket</title>
    <link rel="stylesheet" href="SignupStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div class="form-container">
        <h1>QuickBasket</h1>
        <h2>Create Account</h2>
        <p>Sign up to get started with QuickBasket.</p>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

            <button type="submit">Create Account</button>
        </form>

        <p id="message"></p>

        <p class="form-link">
            Already have an account? <a href="Login.html">Login</a>
        </p>

        <p class="form-link">
            <a href="Blinkit.html">Back to Home</a>
        </p>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

            message.textContent =
                "Form validated successfully! Real account creation requires a backend.";
        });
    </script>

</body>
</html>
